<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jupiter Protection — hero preview (video background)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Semi+Condensed:wght@500;700&display=swap" rel="stylesheet">
<style>
/* =========================================================================
   Rekonstruksi hero jupiterprotection.com — nilai diambil langsung dari CSS
   situ aslinya (Elementor kit post-6, halaman post-7, header post-34).
   Satu-satunya perubahan: background-image hero diganti <video>.
   Breakpoint Elementor: mobile <=767 · tablet 768-1024 · desktop >=1025
   ========================================================================= */
:root{
  --primary:#1F3A5F;      /* --e-global-color-primary  */
  --secondary:#3B7EC8;    /* --e-global-color-secondary */
  --accent:#E8EFF6;       /* --e-global-color-accent   */
  --white:#FFFFFF;        /* --e-global-color-ae05902  */
  --container-max-width:1140px;
  --widgets-spacing:20px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Barlow",Sans-serif;font-size:14px;font-weight:400;
  color:var(--primary);background:var(--secondary);-webkit-font-smoothing:antialiased;
}
img{border:0;max-width:100%;height:auto}
a{text-decoration:none}

/* ---------------- HEADER (f95ca90) — desktop & tablet ------------------- */
.jp-header{
  position:sticky;top:0;z-index:1000;
  display:flex;flex-direction:row;align-items:center;
  gap:var(--widgets-spacing);
  padding:20px 60px;
  background:transparent;                 /* .elementor-sticky:not(--effects) */
  transition:.5s all ease-in-out;
}
.jp-header.is-stuck{                      /* .elementor-sticky--effects      */
  background:var(--primary);
  box-shadow:0 4px 10px rgba(0,0,0,.1);
}
.jp-logo{flex:0 1 auto;min-width:0}
.jp-logo img{display:block;width:199px;height:auto;max-width:100%}
.jp-navwrap{                              /* 05cc94c */
  display:flex;flex-direction:row;justify-content:flex-end;align-items:flex-end;
  flex:0 1 auto;width:100%;min-width:0;
}
.jp-toggle{                               /* .elementor-menu-toggle (tablet) */
  display:none;align-items:center;justify-content:center;
  width:33px;height:33px;padding:5.5px;border:0;border-radius:3px;
  background:transparent;color:var(--white);cursor:pointer;
}
.jp-toggle svg{width:22px;height:22px;fill:currentColor}
.jp-nav{display:flex;flex-wrap:wrap;justify-content:flex-end;margin:0;padding:0;list-style:none}
.jp-nav a{                                /* ce6d3ed .elementor-item */
  display:block;position:relative;
  font-family:"Barlow",Sans-serif;font-weight:600;text-transform:uppercase;
  font-size:14px;line-height:1.2;color:var(--white);
  padding:13px 11px;transition:.4s;
}
.jp-nav a:hover{color:var(--secondary)}

/* ---------------- HEADER (e9851cd) — mobile ---------------------------- */
.jp-header-m{
  display:none;position:sticky;top:0;z-index:1000;
  flex-direction:row;flex-wrap:nowrap;align-items:center;
  gap:var(--widgets-spacing);
  padding:10px 20px 15px;
  background:transparent;transition:.5s all ease-in-out;
}
.jp-header-m.is-stuck{background:var(--primary);box-shadow:0 4px 10px rgba(0,0,0,.1)}
.jp-burger{flex:0 1 auto;width:100%;min-width:0;display:flex;align-items:center;justify-content:flex-end}
.jp-burger svg{width:20px;height:20px;fill:var(--white)}

/* ---------------- HERO (39ad907) --------------------------------------- */
.jp-hero{
  position:relative;overflow:hidden;
  display:flex;flex-direction:row;
  justify-content:center;align-items:flex-end;
  min-height:950px;
  margin-top:-95px;
  padding:0 0 150px;
}
.jp-hero__video{                          /* pengganti background-image:cover */
  position:absolute;inset:0;top:0;right:0;bottom:0;left:0;   /* inset eksplisit: Safari lama */
  width:100%;height:100%;
  object-fit:cover;object-position:center center;
  z-index:0;background:transparent;
}

.jp-hero__scrim{                          /* overlay hitam tipis (tambahan, bukan dari situs asli) */
  position:absolute;inset:0;z-index:1;pointer-events:none;
  background:rgba(0,0,0,.28);
}
.jp-hero__inner{                          /* .e-con-inner, --content-width:100% */
  position:relative;z-index:2;
  display:flex;flex-direction:row;align-items:flex-end;justify-content:center;
  gap:var(--widgets-spacing);
  width:100%;max-width:100%;margin:0 auto;
}
/* Dua spacer kosong mengapit kolom teks — inilah yang menentukan lebar kolom
   dan titik pecah baris judul di situs asli. Keduanya elementor-hidden-mobile. */
.jp-hero__spacer{flex:0 1 auto;min-width:0;padding:10px;display:flex}
.jp-hero__spacer--l{width:10%}             /* da8d815 */
.jp-hero__spacer--r{width:70%}             /* d5a7238 */
.jp-hero__content{                         /* 6162e4b */
  display:flex;flex-direction:column;
  gap:var(--widgets-spacing);
  flex:0 1 auto;width:100%;min-width:0;padding:10px;
}
.jp-hero__title{                           /* 0b3d3d6 + kit h1 */
  margin:0;
  font-family:"Barlow",Sans-serif;font-weight:600;font-size:50px;line-height:1;
  text-transform:uppercase;color:var(--white);
  text-shadow:2px 2px 1px rgba(0,0,0,.3);
}
.jp-hero__buttons{display:flex;flex-direction:row;gap:var(--widgets-spacing)}  /* a2319fa */

/* Tombol: kit button + elementor-size-sm + override e325aa4 / 95c0cf1 */
.jp-btn{
  display:inline-block;text-align:center;line-height:1;
  font-family:"Barlow Semi Condensed",Sans-serif;font-weight:700;text-transform:uppercase;
  font-size:15px;padding:12px 24px;border-radius:3px;
  border:2px solid var(--white);transition:all .3s;cursor:pointer;
}
.jp-btn--solid{background-color:var(--accent);color:var(--primary)}
.jp-btn--solid:hover{background-color:transparent;color:var(--white)}
.jp-btn--ghost{background-color:transparent;color:var(--white)}
.jp-btn--ghost:hover{background-color:var(--white);color:var(--primary)}

/* ---------------- Tablet: 768-1024 ------------------------------------- */
@media(max-width:1024px){
  :root{--container-max-width:1024px}
  .jp-nav{display:none}
  .jp-toggle{display:flex}
  .jp-navwrap{min-height:63px;align-items:center}   /* tinggi terukur di situs asli */

}
/* Tablet saja (768-1024): tarik hero setinggi header supaya tak ada celah di atas */
@media(min-width:768px) and (max-width:1024px){
  .jp-hero{margin-top:-103px}
}
/* ---------------- Mobile: <=767 ---------------------------------------- */
@media(max-width:767px){
  :root{--container-max-width:767px}
  .jp-header{display:none}
  .jp-header-m{display:flex}
  .jp-hero{
    min-height:800px;
    justify-content:flex-end;
    flex-wrap:wrap;
    padding:0 0 100px;
  }
  .jp-hero__video{object-position:top center}   /* background-position:top center */
  .jp-hero__inner{flex-wrap:wrap}
  .jp-hero__spacer{display:none}   /* elementor-hidden-mobile */
  .jp-hero__content{gap:20px;padding:0 25px;flex-basis:100%}
  .jp-hero__title{font-size:40px}
  .jp-hero__buttons{gap:10px;flex-wrap:nowrap}
  .jp-btn{font-size:12px;padding:10px 5px}
}

</style>
</head>
